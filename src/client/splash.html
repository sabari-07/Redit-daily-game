<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <title>Skyline</title>
  <link rel="stylesheet" href="./ui/styles.css">
  <style>
    body { background: #0b1026; overflow: hidden; }
    #splash-canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #splash { display: none; }
  </style>
</head>
<body>
  <canvas id="splash-canvas" aria-hidden="true"></canvas>

  <div id="splash" class="splash" role="main" aria-label="Skyline game start screen">
    <div class="splash-title" aria-label="Skyline">SKYLINE</div>
    <div class="splash-desc">Find the shortest rooftop route through today's city.</div>
    <div class="splash-teaser" id="splash-teaser"></div>
    <div class="splash-meta">
      <span id="splash-date"></span>
      <span class="splash-stats" id="splash-stats"></span>
      <span class="splash-points" id="splash-points" style="display:none"></span>
    </div>
    <button id="play-btn" class="btn-primary splash-play-btn" aria-label="Play Skyline">Play</button>
    <div class="splash-attribution" id="splash-attribution">Built from today's community posts</div>
  </div>

  <script type="module" src="./splash.ts"></script>
</body>
</html>
